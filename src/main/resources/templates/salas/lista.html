<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Salas</title>
</head>
<body>
    <h1>Lista de Salas</h1>

    <form th:action="@{/salas}" method="get">
        <input type="text" name="nome" placeholder="Buscar por nome..." th:value="${nomeFiltro}">
        <button type="submit">Buscar</button>
        <a th:href="@{/salas}"><button type="button">Limpar</button></a>
    </form>

    <br>

    <a th:href="@{/salas/nova}">Cadastrar Nova Sala</a>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Capacidade</th>
            <th>Descrição</th>
            <th>Ações</th>
        </tr>
        <tr th:each="sala : ${salas}">
            <td th:text="${sala.id}"></td>
            <td th:text="${sala.nome}"></td>
            <td th:text="${sala.capacidade}"></td>
            <td th:text="${sala.descricao}"></td>
            <td>
                <a th:href="@{/salas/editar/{id}(id=${sala.id})}">Editar</a>
                <a th:href="@{/salas/excluir/{id}(id=${sala.id})}" onclick="return confirm('Tem certeza?')">Excluir</a>
            </td>
        </tr>
    </table>

    <br>
    <a th:href="@{/usuarios}">Usuários</a> | <a th:href="@{/reservas}">Reservas</a>
</body>
</html>
