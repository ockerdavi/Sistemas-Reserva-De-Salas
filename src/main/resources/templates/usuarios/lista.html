<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Usuários</title>
</head>
<body>
    <h1>Lista de Usuários</h1>

    <a th:href="@{/usuarios/novo}">Cadastrar Novo Usuário</a>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Matrícula</th>
            <th>Ações</th>
        </tr>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.id}"></td>
            <td th:text="${usuario.nome}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.matricula}"></td>
            <td>
                <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a>
                <a th:href="@{/usuarios/excluir/{id}(id=${usuario.id})}" onclick="return confirm('Tem certeza?')">Excluir</a>
            </td>
        </tr>
    </table>

    <br>
    <a th:href="@{/salas}">Voltar para Salas</a>
</body>
</html>
