# Nome do banco de dados (você precisa criar no MySQL antes!)
spring.datasource.url=jdbc:mysql://localhost:3306/reserva_salas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo

# Seu usuário e senha do MySQL
spring.datasource.username=root
spring.datasource.password=root

# Dialeto do MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Estratégia de criação das tabelas
# 'update' = cria/atualiza tabelas automaticamente (bom para desenvolvimento)
# 'validate' = só valida se as tabelas existem (bom para produção)
spring.jpa.hibernate.ddl-auto=update

# Mostrar o SQL no console (opcional, mas ajuda a aprender)
spring.jpa.show-sql=true